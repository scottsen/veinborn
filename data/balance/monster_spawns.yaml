# Monster Spawning Configuration
#
# This file defines how monsters spawn on each floor, including:
# - Monster counts (how many spawn per floor)
# - Monster types and weights (spawn probabilities)
# - Difficulty progression over floors
#
# Design Goals:
# - Floor 1: Tutorial (only Goblins, beatable by new players)
# - Floors 2-5: Gradual difficulty increase
# - Floors 6-10: Balanced mix
# - Floors 11+: High difficulty (more Trolls)
#
# Floor bands: the keys under monster_counts and spawn_weights name their floor
# range (floor_N, floors_A_B, floors_A_plus; src/core/config/floor_bands.py).
# Add or split a band by adding a key; the game checks at load that the bands
# start at floor 1, leave no gaps, do not overlap and end with a _plus band, and
# that every monster named here is defined in data/entities/monsters.yaml.

# Monster count formulas by floor range
monster_counts:
  # Floors 1-6: Gentle introduction
  floors_1_6:
    base: 3
    divisor: 2
    formula: "3 + (floor // 2)"
    description: "Floor 1 = 3 monsters, Floor 2 = 4, etc."

  # Floors 7-20: Medium difficulty
  floors_7_20:
    base: 5
    divisor: 3
    formula: "5 + (floor // 3)"
    description: "Progressive scaling, 7-11 monsters"

  # Floors 21+: High difficulty (capped)
  floors_21_plus:
    base: 8
    divisor: 10
    formula: "min(12, 8 + (floor // 10))"
    max: 12
    description: "Caps at 12 monsters per floor"

# Monster strength by floor (VB-75). Each listed stat is multiplied by
#   1 + per_floor * (floor - 1)
# and rounded, for every monster spawned, wandering in or summoned on that floor.
# Why: crafted gear stops improving around floor 12 and player level around 50,
# but the game runs to floor 100, so without this deeper floors are no harder.
# A monster with `floor_scaling: false` in monsters.yaml keeps its own stats (a boss).
# Measured with scripts/sim_duels.py and bot long runs; see VB-75 in TASKS.md.
floor_scaling:
  per_floor: 0.0
  stats: [hp, attack, defense]

# Bosses (VB-75): exactly one of this monster is placed on that floor, on top of the
# floor's normal monsters (monster dens and wanderers never draw it). The victory
# floor (game_constants.yaml progression.victory_floor, 100) is reached, not played,
# so the final boss guards floor 99.
boss_floors:
  99: ancient_horror

# Monster spawn weights by floor
# Weight determines spawn probability
# Example: goblin: 70, orc: 30 = 70% Goblins, 30% Orcs
spawn_weights:
  floor_1:
    goblin: 80
    bat: 20
    description: "Tutorial floor - weak enemies only"

  floor_2:
    goblin: 50
    bat: 30
    orc: 20
    description: "Introduce swarms and tougher enemies"

  floors_3_5:
    goblin: 30
    bat: 20
    skeleton: 20
    orc: 20
    wolf: 10
    description: "Variety of enemy types"

  floors_6_10:
    goblin: 15
    bat: 10
    skeleton: 20
    orc: 20
    wolf: 15
    spider: 10
    troll: 5
    ogre: 5
    description: "Balanced mix, introduce elites"

  floors_11_15:
    skeleton: 20
    orc: 15
    wolf: 15
    spider: 15
    troll: 15
    ogre: 10
    imp: 10
    wraith: 5
    mimic: 5
    description: "Mid-late game variety; first wraiths (Shadow Cloak material, recipe floor 10+)"

  # Floors 16+ (VB-69): the deep roster in rising base strength
  # (mimic, wraith, golem < wyvern, vampire < basilisk, lich < demon, phoenix).
  # Each boss-material monster appears around or after its legendary recipe unlocks
  # (recipes.yaml min_floor): wyvern 16+ (Dragon Bow 18), lich 26+ (Arcane Staff 12),
  # phoenix 41+ (Flaming Sword / Phoenix Armor 15). floor_scaling makes every band
  # stronger as floors go deeper.
  floors_16_25:
    troll: 20
    ogre: 15
    imp: 15
    wraith: 15
    mimic: 10
    golem: 10
    wyvern: 10
    vampire: 5
    description: "Deep floors begin: undead, constructs and the first wyverns"

  floors_26_40:
    troll: 10
    ogre: 10
    imp: 10
    wraith: 10
    golem: 10
    wyvern: 15
    vampire: 15
    basilisk: 10
    lich: 10
    description: "Vampires, basilisks and the first liches"

  floors_41_60:
    ogre: 5
    imp: 5
    wyvern: 10
    vampire: 15
    basilisk: 15
    lich: 20
    demon: 15
    phoenix: 15
    description: "Demons and phoenixes join"

  floors_61_plus:
    vampire: 10
    basilisk: 15
    lich: 20
    demon: 25
    phoenix: 30
    description: "The abyss: the strongest monsters only"

# Combat balance validation
# These values verify that floors are beatable
combat_balance:
  player_starting_stats:
    hp: 20
    attack: 5
    defense: 2

  monster_stats:
    goblin:
      hp: 6
      attack: 3
      defense: 1
      player_damage: 4  # Player deals this to Goblin
      goblin_damage: 1  # Goblin deals this to Player
      hits_to_kill: 2
      description: "Easy win for player"

    orc:
      hp: 12
      attack: 5
      defense: 2
      player_damage: 3
      orc_damage: 3
      hits_to_kill: 4
      description: "Winnable but takes damage"

    troll:
      hp: 20
      attack: 7
      defense: 3
      player_damage: 2
      troll_damage: 5
      hits_to_kill: 10
      description: "Unbeatable at level 1 - requires power progression"
