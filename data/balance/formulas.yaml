# Game Formula Configuration
#
# Centralizes all mathematical formulas used in game mechanics.
# Makes it easy to tune combat balance, progression curves, etc.

# Combat Formulas (read by AttackAction for every player and monster swing)
#
# NetHack-flavoured: each swing first rolls to hit, then rolls damage.
# Attack makes you hit more often and harder; defense makes you get hit less
# often and for less. There are no critical hits (NetHack has none either).
combat:
  # To-hit roll: roll a d<die>; natural_miss always misses, natural_hit always hits.
  # Otherwise the formula decides. Names: roll, attacker_attack, defender_defense.
  # Examples: attack 5 vs defense 1 -> hit on 6+ (75%); attack 3 vs defense 3 -> 10+ (55%).
  to_hit:
    die: 20
    formula: "roll + attacker_attack >= 10 + defender_defense"
    natural_miss: 1
    natural_hit: 20

  # Damage roll: damage_roll is uniform in
  # [ceil(attack * (1 - spread)), floor(attack * (1 + spread))], so the average
  # stays close to the attack stat. Names: damage_roll, attacker_attack, defender_defense.
  damage:
    formula: "max(1, damage_roll - defender_defense)"
    spread: 0.5
    description: "Rolled damage minus defense, minimum 1 damage"
    min_damage: 1
    max_damage: 9999

# Class abilities (VB-51). Read by AbilityAction / AttackAction.
# Cooldowns are in turns; there is no mana system.
abilities:
  # Mage: ranged, never misses, ignores defense. Hits the nearest monster in
  # line of sight. Damage is a roll in [damage_min, damage_max] plus
  # damage_per_level * (level - 1), rounded down.
  force_bolt:
    range: 6
    damage_min: 2
    damage_max: 6
    damage_per_level: 0.5
    cooldown: 3
  # Healer: restores the caster's own HP (heal_per_level * (level - 1) extra).
  heal:
    amount: 6
    heal_per_level: 1
    cooldown: 12
  # Rogue: passive. The first hit on a monster at full HP does this multiple
  # of its normal damage.
  backstab:
    damage_multiplier: 2

# Health & Regeneration
health:
  # HP Regeneration
  regen_per_turn: 0  # Currently no passive regen
  regen_out_of_combat: 1  # Regen 1 HP/turn when not in combat (10+ turns)

  # Healing Items (future)
  potion_heal_percent: 0.5  # Heal 50% of max HP

# Mining Formulas
mining:
  # Mining Time Calculation
  base_turns: 3
  min_turns: 3
  max_turns: 5
  formula: "min_turns + (hardness * (max_turns - min_turns) // 100)"
  description: "Mining turns based on ore hardness (0-100)"

  # Mining Success Rate (currently 100%)
  success_rate: 1.0

# Crafting Formulas
crafting:
  # Crafting Time
  base_turns: 1  # Instant crafting currently

  # Item Stat Calculation
  weapon_attack:
    formula: "base_attack * (1 + purity/100) * tier_multiplier"
    description: "Attack = base × purity bonus × tier"

  armor_defense:
    formula: "base_defense * (1 + purity/100) * tier_multiplier"
    description: "Defense = base × purity bonus × tier"

  # Tier Multipliers
  tier_multipliers:
    copper: 1.0
    iron: 1.3
    steel: 1.6
    adamantite: 2.0

# Experience & Progression: see game_constants.yaml player.progression (the live XP curve)

# Configuration Versioning
meta:
  version: "1.0.0"
  created: "2025-11-06"
  description: "Game formulas and balance parameters"
  notes: "Formulas use simpleeval syntax for safety"
