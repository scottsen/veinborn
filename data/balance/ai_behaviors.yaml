# AI Behavior Configuration
#
# Defines different monster AI types and their decision-making parameters.
# Each AI type controls how monsters react to the player and environment.
#
# A monster's parameters are: `defaults` below <- its behaviour's section <- its
# `ai:` block in monsters.yaml <- an `ai_params` stat on the monster (AISystem.params_for).
# Design: docs/architecture/AI_ARCHITECTURE.md (ADR-019).

# Universal parameters: every monster has them; any behaviour or monster may override.
# These keys are also the "universal" ai: keys monster validation accepts.
defaults:
  aggro_range: 8      # Perception: notices a player this many 8-way steps away, with line of sight
  memory_turns: 10    # Perception: keeps chasing a player it saw or was hit by, this many turns after
  move_speed: 1.0     # Speed: actions per round on average (1.5 = 3 per 2 rounds, 0.6 = 3 per 5)
  flee_threshold: 0.0 # Morale (engine, before every behaviour): flee below this fraction of max HP; 0 = never

# AI Behavior Types. Ranges here are engagement policy: perception (aggro_range,
# line of sight, memory, being attacked) decides what a monster knows about; the
# behaviour decides what it does about it.
behaviors:
  # Aggressive - Chase and attack player on sight
  aggressive:
    description: "Chase and attack any player it perceives"
    flee_threshold: 0.0  # Never flee

  # Defensive - Attack when threatened, otherwise patrol
  defensive:
    description: "Engage a perceived player within chase_range (or anyone who attacked it), otherwise patrol"
    chase_range: 5  # Engages only players this close, unless attacked
    flee_threshold: 0.3  # Flee when HP < 30%
    patrol_enabled: true

  # Neutral - Wander; fight back against whoever attacks it
  neutral:
    description: "Wander peacefully; fights back when attacked"
    flee_threshold: 0.5  # Flee when HP < 50%

  # Coward - Always flee from player
  coward:
    description: "Run away from any player it perceives within flee_range"
    flee_range: 8  # Start fleeing when a perceived player is within 8 tiles

  # Guard - Stay near spawn point, defend area
  guard:
    description: "Guard a specific location, attack intruders"
    chase_range: 6  # Engages perceived players this close (never leaves guard_radius)
    guard_radius: 4  # Don't stray more than 4 tiles from spawn

  # Berserker: Aggressive, enrages when wounded
  berserker:
    description: "Aggressive fighter, enraged (sees farther) when wounded"
    enraged_aggro_range: 15  # Perception range while enraged
    enrage_threshold: 0.7  # Enrage when HP < 70%

  # Sniper: Ranged attacker, maintains distance
  sniper:
    description: "Ranged attacker, maintains distance"
    ideal_range_min: 4
    ideal_range_max: 6
    flee_threshold: 0.3
    abilities:            # abilities this behaviour brings (monsters.yaml can override or disable)
      ranged_attack:
        range: 6          # shoots up to ideal_range_max
        min_range: 4      # too close to shoot: backs off instead
        cooldown: 0

  # Summoner: Summons allies, avoids combat
  summoner:
    description: "Summons allies, avoids direct combat"
    summon_distance: 8    # keeps away from players closer than this (tactics)
    abilities:
      summon:
        minion_type: goblin   # monsters.yaml id of what it summons
        max_minions: 3        # living minions at once
        range: 8              # summons when a perceived player is this close...
        min_distance: 4       # ...but not closer than this (it flees instead)
        cooldown: 10

# Monster AI assignments live in data/entities/monsters.yaml (`ai: type:`).
# A monster's ai: block may also override any parameter of its behaviour above,
# plus the universal keys in `defaults` (aggro_range, memory_turns, move_speed, flee_threshold); unknown
# keys fail validation at game start. See docs/architecture/AI_ARCHITECTURE.md.

# Configuration Versioning
meta:
  version: "1.0.0"
  created: "2025-11-06"
  description: "AI behavior system with multiple behavior types"
