# Forge Spawning Configuration
#
# Forges are crafting stations where players turn ore → equipment
# This is the KEY interaction point for Veinborn's unique hook
#
# Design Goals:
# - Forges are rare but consistent (1-2 per floor)
# - Better forges on deeper floors
# - Forges are fixed (not destroyable/mineable)

# Forge counts per floor
forge_counts:
  base: 1
  formula: "1"  # Always 1 forge per floor (consistency > variance)
  description: "One forge per floor, guaranteed crafting access"

# Forge type by floor depth. The type is a name and a colour only: what a forge can craft is
# limited by the recipe (its floor and its ore), never by the forge (VB-127).
forge_types:
  basic_forge:
    floors: [1, 2, 3]
    description: "A simple forge (cosmetic: every forge crafts every recipe)"
    symbol: "&"
    color: "copper"

  iron_forge:
    floors: [4, 5, 6]
    description: "A sturdier forge (cosmetic: every forge crafts every recipe)"
    symbol: "&"
    color: "gray"

  master_forge:
    floors: [7, 8, 9, 10, 11, 12, 13, 14, 15]
    description: "A master forge (cosmetic: every forge crafts every recipe)"
    symbol: "&"
    color: "yellow"

# Spawn placement rules
spawn_placement:
  min_distance_from_stairs: 5
  description: "Forges spawn away from stairs for exploration"

  prefer_large_rooms: true
  description: "Forges prefer to spawn in large rooms (logical placement)"

  max_per_room: 1
  description: "Only one forge per room"
